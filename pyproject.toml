[project]
name = "mt-ai-lab"
version = "1.0.0"
description = "Magic Tower AI Lab: a hybrid engine + language-model agent for the Magic Tower game, with an exact solver, a repeated-run evaluation harness, prompt optimisation and a web platform"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "King Wai Siu" }]
requires-python = ">=3.12"
dependencies = [
    "gepa>=0.1.0",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "pillow>=10.0",
]
reflection = [
    "litellm>=1.40",
]
dev = [
    "httpx>=0.27",
    "playwright>=1.40",
]

[project.scripts]
mota-dashboard = "mota.dashboard.server:main"
mota-test = "mota.tests.test_engine:main"

[project.urls]
Repository = "https://github.com/thetobysiu/mt-ai-lab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mota"]
